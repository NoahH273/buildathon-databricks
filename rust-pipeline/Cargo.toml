[package]
name = "shopping-sessions"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
publish = false

[features]
default = []
profiling = []

[dependencies]
ahash = "=0.8.12"
memchr = "=2.8.3"
rayon = "=1.11.0"
arrow-array = "=56.2.0"
arrow-schema = "=56.2.0"
parquet = { version = "=56.2.0", default-features = false, features = ["arrow", "snap"] }
serde_json = "=1.0.145"

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"
overflow-checks = true
