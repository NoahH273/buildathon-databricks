[package]
name = "shopping-sessions"
version = "0.1.0"
edition = "2021"

[dependencies]
memchr = "2"
memmap2 = "0.9"
xxhash-rust = { version = "0.8", features = ["xxh3"] }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
debug = false
